<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery Link Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full">
    <h1 class="text-2xl font-bold mb-2 text-gray-800">Photo Selector Generator</h1>
    <p class="text-sm text-gray-600 mb-6">Buat link pemilihan foto dari Google Drive untuk klien Anda.</p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Link / ID Folder Google Drive</label>
        <input type="text" id="driveInput" placeholder="Contoh: https://drive.google.com/drive/folders/1A2B3C..." class="w-full border p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        <span class="text-xs text-gray-400">Pastikan akses folder Drive sudah "Anyone with the link".</span>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Batas Maksimal Pilihan Foto</label>
        <input type="number" id="limitInput" value="10" min="1" class="w-full border p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>

      <button onclick="generateLink()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">Generate Link Klien</button>

      <div id="resultBox" class="hidden mt-4 p-4 bg-gray-50 border rounded-lg">
        <label class="block text-xs font-semibold text-gray-500 mb-1">LINK UNTUK KLIEN:</label>
        <input type="text" id="generatedUrl" readonly class="w-full bg-white border p-2 rounded text-xs mb-2" />
        <button onclick="copyLink()" class="w-full bg-green-600 hover:bg-green-700 text-white text-xs font-medium py-2 rounded transition">Salin Link</button>
      </div>
    </div>
  </div>

  <script>
    function extractFolderId(input) {
      const match = input.match(/folders\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : input.trim();
    }

    function generateLink() {
      const rawInput = document.getElementById('driveInput').value;
      const limit = document.getElementById('limitInput').value;
      const folderId = extractFolderId(rawInput);

      if (!folderId) {
        alert('Masukkan Link atau ID Folder Google Drive yang valid!');
        return;
      }

      const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '') + 'gallery.html';
      const clientUrl = `${baseUrl}?id=${folderId}&limit=${limit}`;

      document.getElementById('generatedUrl').value = clientUrl;
      document.getElementById('resultBox').classList.remove('hidden');
    }

    function copyLink() {
      const urlInput = document.getElementById('generatedUrl');
      urlInput.select();
      navigator.clipboard.writeText(urlInput.value);
      alert('Link berhasil disalin!');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Selector Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#0e0e11] text-zinc-100 min-h-screen flex flex-col justify-between p-6">

  <!-- Brand / Header -->
  <header class="max-w-md mx-auto w-full pt-4">
    <div class="text-xs uppercase tracking-widest text-zinc-500 font-semibold mb-1">Studio Utility</div>
    <h1 class="text-3xl font-bold tracking-tight text-white">Photo Selector Generator</h1>
    <p class="text-sm text-zinc-400 mt-2">Ubah folder Google Drive menjadi galeri seleksi foto interaktif untuk klien Anda.</p>
  </header>

  <!-- Form Box -->
  <main class="max-w-md mx-auto w-full my-auto py-8">
    <div class="bg-[#18181c] border border-zinc-800/80 p-6 rounded-2xl shadow-2xl space-y-5">
      
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Folder Google Drive</label>
        <input type="text" id="driveInput" placeholder="https://drive.google.com/drive/folders/..." class="w-full bg-[#0e0e11] border border-zinc-800 focus:border-white text-zinc-100 p-3 rounded-xl text-sm outline-none transition placeholder:text-zinc-600" />
        <span class="text-[11px] text-zinc-500 mt-1.5 block">Pastikan akses folder Google Drive diset "Anyone with the link".</span>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Batas Maksimal Pilihan (Limit)</label>
        <input type="number" id="limitInput" value="10" min="1" class="w-full bg-[#0e0e11] border border-zinc-800 focus:border-white text-zinc-100 p-3 rounded-xl text-sm outline-none transition" />
      </div>

      <button onclick="generateLink()" class="w-full bg-white hover:bg-zinc-200 text-black font-semibold py-3 rounded-xl text-sm transition duration-200">
        Generate Link Client
      </button>

      <!-- Hasil Link -->
      <div id="resultBox" class="hidden pt-4 border-t border-zinc-800/80 space-y-3">
        <label class="block text-[11px] font-semibold uppercase tracking-wider text-emerald-400">Link Siap Dibagikan</label>
        <div class="flex gap-2">
          <input type="text" id="generatedUrl" readonly class="w-full bg-[#0e0e11] border border-zinc-800 text-zinc-300 px-3 py-2.5 rounded-xl text-xs font-mono select-all outline-none" />
          <button onclick="copyLink()" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs px-4 rounded-xl font-medium transition shrink-0">
            Copy
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="max-w-md mx-auto w-full text-center pb-4 text-xs text-zinc-600">
    ©Yudi Pratama 2026.
  </footer>

  <script>
    function extractFolderId(input) {
      const match = input.match(/folders\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : input.trim();
    }

    function generateLink() {
      const rawInput = document.getElementById('driveInput').value;
      const limit = document.getElementById('limitInput').value;
      const folderId = extractFolderId(rawInput);

      if (!folderId) {
        alert('Masukkan Link atau ID Folder Google Drive yang valid!');
        return;
      }

      const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '') + 'gallery.html';
      const clientUrl = `${baseUrl}?id=${folderId}&limit=${limit}`;

      document.getElementById('generatedUrl').value = clientUrl;
      document.getElementById('resultBox').classList.remove('hidden');
    }

    function copyLink() {
      const urlInput = document.getElementById('generatedUrl');
      urlInput.select();
      navigator.clipboard.writeText(urlInput.value);
      alert('Link berhasil disalin ke clipboard!');
    }
  </script>
</body>
</html>

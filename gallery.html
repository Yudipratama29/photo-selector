<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selection Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    /* Custom Scrollbar for sleek look */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0e0e11; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
  </style>
</head>
<body class="bg-[#0e0e11] text-zinc-100 min-h-screen pb-28 selection:bg-zinc-800">

  <!-- Header Navbar -->
  <header class="bg-[#0e0e11]/80 backdrop-blur-md border-b border-zinc-800/80 sticky top-0 z-30 px-4 sm:px-8 py-4">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center">
      <div>
        <h1 class="font-bold text-white text-lg tracking-tight">Photo Selection</h1>
        <p class="text-xs text-zinc-400 mt-0.5">Pilih foto favorit Anda sesuai batas kuota.</p>
      </div>

      <!-- Counter Badge -->
      <div class="flex items-center gap-2 bg-[#18181c] border border-zinc-800 px-3.5 py-1.5 rounded-full text-xs">
        <span class="text-zinc-400">Kuota Terpakai:</span>
        <span id="counter" class="font-semibold text-white">0 / 0</span>
      </div>
    </div>
  </header>

  <!-- Controls Bar (Tabs & Sort) -->
  <section class="max-w-7xl mx-auto px-4 sm:px-8 pt-6 pb-2">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-[#141417] p-2 rounded-xl border border-zinc-800/60">
      
      <!-- Filter Tabs -->
      <div class="flex items-center gap-1 bg-[#0e0e11] p-1 rounded-lg w-full sm:w-auto">
        <button id="tabAll" onclick="switchTab('all')" class="flex-1 sm:flex-initial text-xs px-4 py-2 rounded-md font-medium transition text-white bg-zinc-800 shadow-sm">
          All Files (<span id="countAll">0</span>)
        </button>
        <button id="tabSelected" onclick="switchTab('selected')" class="flex-1 sm:flex-initial text-xs px-4 py-2 rounded-md font-medium transition text-zinc-400 hover:text-white">
          Selected (<span id="countSelected">0</span>)
        </button>
      </div>

      <!-- Sort Dropdown -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end px-2 sm:px-0">
        <span class="text-xs text-zinc-500 font-medium">Sort by:</span>
        <select id="sortSelect" onchange="applySortAndFilter()" class="bg-[#0e0e11] border border-zinc-800 text-zinc-200 text-xs rounded-lg px-3 py-1.5 outline-none focus:border-zinc-600 transition cursor-pointer">
          <option value="name-asc">Nama File (A - Z)</option>
          <option value="name-desc">Nama File (Z - A)</option>
          <option value="selected-first">Pilihan Pertama</option>
        </select>
      </div>

    </div>
  </section>

  <!-- Gallery Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-4">
    <div id="loading" class="text-center py-24 text-zinc-500 text-sm font-medium animate-pulse">
      Memuat foto dari Google Drive...
    </div>
    <div id="errorMsg" class="hidden text-center py-20 text-rose-400 text-sm font-medium"></div>
    <div id="emptyState" class="hidden text-center py-20 text-zinc-500 text-sm">
      Belum ada foto yang dipilih.
    </div>

    <div id="galleryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5"></div>
  </main>

  <!-- Sticky Bottom Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-[#0e0e11]/90 backdrop-blur-lg border-t border-zinc-800 p-4 z-30">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-4">
      <span id="statusText" class="text-xs text-zinc-400 hidden sm:inline-block">
        Klik foto untuk memilih, gunakan tombol preview untuk memperbesar.
      </span>
      <button onclick="copySelectedFiles()" class="w-full sm:w-auto bg-white hover:bg-zinc-200 text-black px-6 py-2.5 rounded-xl text-xs font-semibold tracking-wide transition shadow-lg">
        Salin Daftar Foto Selected
      </button>
    </div>
  </div>

  <!-- MODAL PREVIEW (LIGHTBOX) -->
  <div id="previewModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm hidden flex-col justify-between p-4 sm:p-6">
    <!-- Modal Header -->
    <div class="w-full max-w-5xl mx-auto flex justify-between items-center text-zinc-300">
      <span id="modalFileName" class="text-xs font-mono tracking-wider truncate max-w-[250px] sm:max-w-md text-zinc-400"></span>
      <button onclick="closePreview()" class="text-zinc-400 hover:text-white bg-zinc-900/80 hover:bg-zinc-800 rounded-full p-2 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Image Container -->
    <div class="relative flex-1 flex items-center justify-center w-full max-w-5xl mx-auto my-3">
      <img id="modalImage" src="" alt="Preview" class="max-h-[75vh] max-w-full object-contain rounded-xl shadow-2xl" />
    </div>

    <!-- Modal Footer -->
    <div class="w-full max-w-5xl mx-auto flex justify-center items-center pb-2">
      <button id="modalSelectBtn" onclick="toggleSelectFromModal()" class="px-8 py-3 rounded-xl font-semibold text-xs tracking-wider transition shadow-2xl">
        <!-- Status di-render via JS -->
      </button>
    </div>
  </div>

  <script>
    // API KEY GOOGLE DRIVE
    const API_KEY = 'AIzaSyCTXgw53obK4aXbWK5eWQM5SvvfIGeuYDg';

    const urlParams = new URLSearchParams(window.location.search);
    const FOLDER_ID = urlParams.get('id');
    const LIMIT = parseInt(urlParams.get('limit')) || 10;

    let masterFiles = [];      // Menyimpan seluruh file dari Drive
    let selectedFiles = [];    // Menyimpan nama file yang dipilih
    let activeTab = 'all';     // 'all' atau 'selected'
    let currentPreviewFile = null;

    document.getElementById('counter').innerText = `0 / ${LIMIT}`;

    async function fetchPhotos() {
      if (!FOLDER_ID) {
        showError('Link tidak valid. Parameter Folder ID tidak ditemukan.');
        return;
      }

      let allFiles = [];
      let nextPageToken = null;
      const loadingEl = document.getElementById('loading');

      try {
        do {
          let url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'image/'&pageSize=100&fields=nextPageToken,files(id,name,thumbnailLink)&key=${API_KEY}`;

          if (nextPageToken) {
            url += `&pageToken=${nextPageToken}`;
          }

          const response = await fetch(url);
          const data = await response.json();

          if (data.error) {
            showError('Gagal memuat folder. Pastikan folder Drive diset "Anyone with the link".');
            return;
          }

          if (data.files && data.files.length > 0) {
            allFiles = allFiles.concat(data.files);
            loadingEl.innerText = `Memuat foto dari Google Drive... (${allFiles.length} foto ditemukan)`;
          }

          nextPageToken = data.nextPageToken;

        } while (nextPageToken);

        if (allFiles.length === 0) {
          showError('Folder ini kosong atau tidak berisi file gambar.');
          return;
        }

        masterFiles = allFiles;
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('countAll').innerText = masterFiles.length;

        applySortAndFilter();

      } catch (err) {
        showError('Terjadi kesalahan koneksi ke server.');
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      const tabAll = document.getElementById('tabAll');
      const tabSelected = document.getElementById('tabSelected');

      if (tab === 'all') {
        tabAll.className = "flex-1 sm:flex-initial text-xs px-4 py-2 rounded-md font-medium transition text-white bg-zinc-800 shadow-sm";
        tabSelected.className = "flex-1 sm:flex-initial text-xs px-4 py-2 rounded-md font-medium transition text-zinc-400 hover:text-white";
      } else {
        tabSelected.className = "flex-1 sm:flex-initial text-xs px-4 py-2 rounded-md font-medium transition text-white bg-zinc-800 shadow-sm";
        tabAll.className = "flex-1 sm:flex-initial text-xs px-4 py-2 rounded-md font-medium transition text-zinc-400 hover:text-white";
      }

      applySortAndFilter();
    }

    function applySortAndFilter() {
      let filtered = [...masterFiles];

      // 1. Filtering berdasarkan Tab Active
      if (activeTab === 'selected') {
        filtered = filtered.filter(f => selectedFiles.includes(f.name));
      }

      // 2. Sorting
      const sortValue = document.getElementById('sortSelect').value;
      filtered.sort((a, b) => {
        if (sortValue === 'name-asc') {
          return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
        } else if (sortValue === 'name-desc') {
          return b.name.localeCompare(a.name, undefined, { numeric: true, sensitivity: 'base' });
        } else if (sortValue === 'selected-first') {
          const aSelected = selectedFiles.includes(a.name) ? 1 : 0;
          const bSelected = selectedFiles.includes(b.name) ? 1 : 0;
          return bSelected - aSelected;
        }
        return 0;
      });

      renderGallery(filtered);
    }

    function renderGallery(files) {
      const grid = document.getElementById('galleryGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      if (files.length === 0 && activeTab === 'selected') {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      files.forEach((file) => {
        const thumbUrl = file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+/, '=s400') : '';
        const previewUrl = file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+/, '=s1600') : '';
        const isSelected = selectedFiles.includes(file.name);

        const card = document.createElement('div');
        card.className = `group relative rounded-xl overflow-hidden bg-[#18181c] border transition-all duration-200 cursor-pointer ${
          isSelected ? 'border-white ring-1 ring-white' : 'border-zinc-800/80 hover:border-zinc-700'
        }`;
        card.id = `file-${file.id}`;

        card.innerHTML = `
          <div class="aspect-[4/3] w-full overflow-hidden bg-zinc-900 relative">
            <img src="${thumbUrl}" alt="${file.name}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy" />
            
            <!-- Sleek Minimalist Zoom/Preview Icon -->
            <button onclick="openPreview(event, '${file.name}', '${file.id}', '${previewUrl}')" 
                    class="absolute top-2.5 right-2.5 bg-black/60 hover:bg-black/90 backdrop-blur-md text-zinc-300 hover:text-white p-2 rounded-lg opacity-80 sm:opacity-0 group-hover:opacity-100 transition-all duration-200" 
                    title="Preview Large">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>

            <!-- Selection Indicator Checkbox Style -->
            <div class="selected-badge absolute top-2.5 left-2.5 w-5 h-5 rounded-full bg-white text-black flex items-center justify-center ${isSelected ? 'flex' : 'hidden'}">
              <svg class="w-3 h-3 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
          </div>

          <div class="p-2.5 bg-[#18181c]">
            <p class="text-[11px] font-mono text-zinc-400 truncate">${file.name}</p>
          </div>
        `;

        card.onclick = (e) => {
          if (!e.target.closest('button')) {
            toggleSelect(file.name, file.id);
          }
        };

        grid.appendChild(card);
      });
    }

    // --- PREVIEW MODAL ---
    function openPreview(event, fileName, fileId, previewUrl) {
      event.stopPropagation();
      currentPreviewFile = { name: fileName, id: fileId };

      document.getElementById('modalFileName').innerText = fileName;
      document.getElementById('modalImage').src = previewUrl;

      updateModalBtnUI();
      document.getElementById('previewModal').classList.remove('hidden');
      document.getElementById('previewModal').classList.add('flex');
    }

    function closePreview() {
      document.getElementById('previewModal').classList.add('hidden');
      document.getElementById('previewModal').classList.remove('flex');
      currentPreviewFile = null;
      document.getElementById('modalImage').src = "";
    }

    function toggleSelectFromModal() {
      if (!currentPreviewFile) return;
      toggleSelect(currentPreviewFile.name, currentPreviewFile.id);
      updateModalBtnUI();
    }

    function updateModalBtnUI() {
      if (!currentPreviewFile) return;

      const btn = document.getElementById('modalSelectBtn');
      const isSelected = selectedFiles.includes(currentPreviewFile.name);

      if (isSelected) {
        btn.className = "px-8 py-3 rounded-xl font-semibold text-xs tracking-wider transition shadow-2xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20";
        btn.innerText = "DESELECT PHOTO";
      } else {
        btn.className = "px-8 py-3 rounded-xl font-semibold text-xs tracking-wider transition shadow-2xl bg-white hover:bg-zinc-200 text-black";
        btn.innerText = "SELECT PHOTO";
      }
    }

    // --- LOGIKA SELEKSI ---
    function toggleSelect(fileName, fileId) {
      const index = selectedFiles.indexOf(fileName);

      if (index > -1) {
        selectedFiles.splice(index, 1);
      } else {
        if (selectedFiles.length >= LIMIT) {
          alert(`Batas maksimum pilihan Anda adalah ${LIMIT} foto!`);
          return;
        }
        selectedFiles.push(fileName);
      }

      // Update Counters
      document.getElementById('counter').innerText = `${selectedFiles.length} / ${LIMIT}`;
      document.getElementById('countSelected').innerText = selectedFiles.length;

      // Re-render
      applySortAndFilter();
    }

    function copySelectedFiles() {
      if (selectedFiles.length === 0) {
        alert('Anda belum memilih foto apapun.');
        return;
      }

      const formattedText = `Halo Kak, berikut daftar foto yang saya pilih (${selectedFiles.length}/${LIMIT} foto):\n\n` + 
        selectedFiles.map((name, i) => `${i + 1}. ${name}`).join('\n');

      navigator.clipboard.writeText(formattedText);
      alert('Daftar nama foto berhasil disalin! Tinggal paste di chat WA fotografer Anda.');
    }

    function showError(msg) {
      document.getElementById('loading').classList.add('hidden');
      const errBox = document.getElementById('errorMsg');
      errBox.innerText = msg;
      errBox.classList.remove('hidden');
    }

    fetchPhotos();
  </script>
</body>
</html>

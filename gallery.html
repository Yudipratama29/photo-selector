<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilih Foto Anda</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-24">
  <!-- Header Navbar -->
  <header class="bg-white border-b sticky top-0 z-10 px-4 py-3 shadow-sm flex justify-between items-center">
    <div>
      <h1 class="font-bold text-gray-800 text-lg">Pilih Foto Pilihan Anda</h1>
      <p class="text-xs text-gray-500">Klik ikon zoom untuk preview, klik card untuk memilih.</p>
    </div>
    <div class="text-right">
      <span class="text-xs text-gray-500 block">Kuota Pilihan</span>
      <span id="counter" class="font-bold text-blue-600 text-sm">0 / 0</span>
    </div>
  </header>

  <!-- Gallery Container -->
  <main class="max-w-6xl mx-auto p-4">
    <div id="loading" class="text-center py-12 text-gray-500 font-medium">Memuat foto dari Google Drive...</div>
    <div id="errorMsg" class="hidden text-center py-12 text-red-500 font-medium"></div>
    <div id="galleryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
  </main>

  <!-- Sticky Bottom Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 shadow-lg flex justify-between items-center max-w-6xl mx-auto z-10">
    <span id="statusText" class="text-xs text-gray-600">Pilih foto sesuai kuota.</span>
    <button onclick="copySelectedFiles()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
      Salin Daftar Foto Selected
    </button>
  </div>

  <!-- MODAL PREVIEW (LIGHTBOX) -->
  <div id="previewModal" class="fixed inset-0 z-50 bg-black/90 hidden flex-col items-center justify-between p-4">
    <!-- Modal Header / Close Button -->
    <div class="w-full max-w-4xl flex justify-between items-center text-white">
      <span id="modalFileName" class="text-sm font-medium truncate max-w-[200px] sm:max-w-md"></span>
      <button onclick="closePreview()" class="text-white bg-white/20 hover:bg-white/40 rounded-full w-8 h-8 flex items-center justify-center font-bold">✕</button>
    </div>

    <!-- Image Container (Tampilan Foto Besar) -->
    <div class="relative flex-1 flex items-center justify-center w-full max-w-4xl my-2">
      <img id="modalImage" src="" alt="Preview" class="max-h-[75vh] max-w-full object-contain rounded-lg shadow-2xl" />
    </div>

    <!-- Modal Footer / Action Button -->
    <div class="w-full max-w-4xl flex justify-center items-center gap-4">
      <button id="modalSelectBtn" onclick="toggleSelectFromModal()" class="px-6 py-2.5 rounded-full font-medium text-sm transition flex items-center gap-2 shadow-lg">
        <!-- Text & Status di-render via JS -->
      </button>
    </div>
  </div>

  <script>
    // MASUKKAN API KEY ANDA DI SINI
    const API_KEY = 'AIzaSyCTXgw53obK4aXbWK5eWQM5SvvfIGeuYDg';

    const urlParams = new URLSearchParams(window.location.search);
    const FOLDER_ID = urlParams.get('id');
    const LIMIT = parseInt(urlParams.get('limit')) || 10;

    let selectedFiles = [];
    let currentPreviewFile = null;

    document.getElementById('counter').innerText = `0 / ${LIMIT}`;

    async function fetchPhotos() {
      if (!FOLDER_ID) {
        showError('Link tidak valid. Parameter Folder ID tidak ditemukan.');
        return;
      }

      let allFiles = [];
      let nextPageToken = null;
      const loadingEl = document.getElementById('loading');

      try {
        // Paginasi: Ambil terus menerus sampai semua file terambil
        do {
          let url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'image/'&pageSize=100&fields=nextPageToken,files(id,name,thumbnailLink)&key=${API_KEY}`;

          if (nextPageToken) {
            url += `&pageToken=${nextPageToken}`;
          }

          const response = await fetch(url);
          const data = await response.json();

          if (data.error) {
            showError('Gagal memuat folder. Pastikan folder Drive diset "Anyone with the link".');
            return;
          }

          if (data.files && data.files.length > 0) {
            allFiles = allFiles.concat(data.files);
            loadingEl.innerText = `Memuat foto dari Google Drive... (${allFiles.length} foto ditemukan)`;
          }

          nextPageToken = data.nextPageToken;

        } while (nextPageToken);

        if (allFiles.length === 0) {
          showError('Folder ini kosong atau tidak berisi file gambar.');
          return;
        }

        loadingEl.classList.add('hidden');
        renderGallery(allFiles);

      } catch (err) {
        showError('Terjadi kesalahan koneksi ke server.');
      }
    }

    function renderGallery(files) {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      files.forEach((file) => {
        // s400 untuk Thumbnail Grid (Ringan), s1600 untuk Preview (Tajam)
        const thumbUrl = file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+/, '=s400') : '';
        const previewUrl = file.thumbnailLink ? file.thumbnailLink.replace(/=s\d+/, '=s1600') : '';

        const card = document.createElement('div');
        card.className = 'relative group border-2 border-transparent rounded-lg overflow-hidden bg-gray-200 cursor-pointer transition';
        card.id = `file-${file.id}`;

        card.innerHTML = `
          <img src="${thumbUrl}" alt="${file.name}" class="w-full h-36 sm:h-44 object-cover" loading="lazy" />
          
          <!-- Tombol Preview (Kaca Pembesar) -->
          <button onclick="openPreview(event, '${file.name}', '${file.id}', '${previewUrl}')" class="absolute top-2 right-2 bg-black/60 hover:bg-black text-white p-1.5 rounded-full text-xs transition z-10" title="Zoom/Preview">
            🔍
          </button>

          <div class="p-1.5 bg-white text-center">
            <p class="text-[10px] text-gray-600 truncate">${file.name}</p>
          </div>

          <div class="overlay absolute inset-0 bg-blue-600/30 hidden items-center justify-center">
            <span class="bg-blue-600 text-white rounded-full p-1 text-xs font-semibold">✓ Selected</span>
          </div>
        `;

        // Klik gambar untuk toggle select, kecuali tombol preview
        card.onclick = (e) => {
          if (!e.target.closest('button')) {
            toggleSelect(file.name, file.id);
          }
        };

        grid.appendChild(card);
      });
    }

    // --- FUNGSI PREVIEW MODAL ---
    function openPreview(event, fileName, fileId, previewUrl) {
      event.stopPropagation();
      currentPreviewFile = { name: fileName, id: fileId };

      document.getElementById('modalFileName').innerText = fileName;
      document.getElementById('modalImage').src = previewUrl;

      updateModalBtnUI();
      document.getElementById('previewModal').classList.remove('hidden');
      document.getElementById('previewModal').classList.add('flex');
    }

    function closePreview() {
      document.getElementById('previewModal').classList.add('hidden');
      document.getElementById('previewModal').classList.remove('flex');
      currentPreviewFile = null;
      document.getElementById('modalImage').src = ""; // Bersihkan image
    }

    function toggleSelectFromModal() {
      if (!currentPreviewFile) return;
      toggleSelect(currentPreviewFile.name, currentPreviewFile.id);
      updateModalBtnUI();
    }

    function updateModalBtnUI() {
      if (!currentPreviewFile) return;

      const btn = document.getElementById('modalSelectBtn');
      const isSelected = selectedFiles.includes(currentPreviewFile.name);

      if (isSelected) {
        btn.className = "px-6 py-2.5 rounded-full font-medium text-sm transition flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white shadow-lg";
        btn.innerHTML = "❌ Batalkan Pilihan Foto Ini";
      } else {
        btn.className = "px-6 py-2.5 rounded-full font-medium text-sm transition flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white shadow-lg";
        btn.innerHTML = "✓ Pilih Foto Ini";
      }
    }

    // --- LOGIKA SELEKSI ---
    function toggleSelect(fileName, fileId) {
      const card = document.getElementById(`file-${fileId}`);
      const overlay = card.querySelector('.overlay');
      const index = selectedFiles.indexOf(fileName);

      if (index > -1) {
        // Batal pilih
        selectedFiles.splice(index, 1);
        card.classList.remove('border-blue-600');
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      } else {
        // Cek limit
        if (selectedFiles.length >= LIMIT) {
          alert(`Batas maksimum pilihan Anda adalah ${LIMIT} foto!`);
          return;
        }
        selectedFiles.push(fileName);
        card.classList.add('border-blue-600');
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }

      document.getElementById('counter').innerText = `${selectedFiles.length} / ${LIMIT}`;
    }

    function copySelectedFiles() {
      if (selectedFiles.length === 0) {
        alert('Anda belum memilih foto apapun.');
        return;
      }

      const formattedText = `Halo Kak, berikut daftar foto yang saya pilih (${selectedFiles.length}/${LIMIT} foto):\n\n` + 
        selectedFiles.map((name, i) => `${i + 1}. ${name}`).join('\n');

      navigator.clipboard.writeText(formattedText);
      alert('Daftar nama foto berhasil disalin! Tinggal paste di chat WA fotografer Anda.');
    }

    function showError(msg) {
      document.getElementById('loading').classList.add('hidden');
      const errBox = document.getElementById('errorMsg');
      errBox.innerText = msg;
      errBox.classList.remove('hidden');
    }

    fetchPhotos();
  </script>
</body>
</html>
